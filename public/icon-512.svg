  <circle cx="256" cy="208" r="7" fill="#FE7D04"/>
  <!-- Open Book -->
  <path d="M 144 340 C 184 320 226 325 256 335 C 286 325 328 320 368 340 L 368 370 C 328 350 286 355 256 365 C 226 355 184 350 144 370 Z" fill="#06143D"/>
