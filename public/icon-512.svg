      <stop offset="100%" stopColor="#FFA048" />
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#081E5B" />
      <stop offset="100%" stopColor="#030C26" />
    </linearGradient>
  </defs>
  <!-- Tablet Body -->
  <rect x="96" y="48" width="320" height="416" rx="48" fill="url(#tabGrad)" stroke="#003068" stroke-width="8"/>
  <circle cx="256" cy="74" r="6" fill="#5B6472"/>
  <circle cx="256" cy="436" r="14" fill="#FFFFFF" fill-opacity="0.9"/>
